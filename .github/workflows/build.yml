name: Test and release IV Outreach

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm test
      - run: npm run build
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version must match.' }
      - name: Restore pinned Maps scraper
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run vendor:restore
      - name: Build Windows release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: windows-release
          path: |
            dist/IV-Outreach-Setup-*.exe
            dist/IV-Outreach-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download verified build and publish complete release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh run download $env:GITHUB_RUN_ID --name windows-release --dir release
          if ($LASTEXITCODE -ne 0) { throw 'Could not download release artifacts.' }
          $assets = @(Get-ChildItem release -File | Select-Object -ExpandProperty FullName)
          if ($assets.Count -ne 3 -or !(Test-Path release/latest.yml)) { throw 'Release must include installer, blockmap and update manifest.' }
          gh release create $env:GITHUB_REF_NAME @assets --verify-tag --draft --title "IV Outreach $env:GITHUB_REF_NAME" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release; nothing published.' }
          gh release edit $env:GITHUB_REF_NAME --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Draft uploaded but publication failed.' }
